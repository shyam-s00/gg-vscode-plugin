name: Publish

# Fires automatically once release.yml publishes a GitHub Release, or can be
# re-run manually against an existing tag. Downloads the exact .vsix already
# attached to that release (no rebuild) and publishes it to both
# marketplaces, so what ships is byte-identical to the GitHub Release asset.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.2.3) — must already have a .vsix asset"
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish to marketplaces
    runs-on: ubuntu-latest

    steps:
      - name: Resolve tag
        id: tag
        run: echo "tag=${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"

      - name: Download .vsix from GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "${{ steps.tag.outputs.tag }}" --repo "${{ github.repository }}" --pattern "*.vsix"

      - name: Ensure Open VSX namespace exists
        run: npx ovsx create-namespace gopherglide -p "${{ secrets.OVSX_PAT }}" || true

      - name: Publish to VS Code Marketplace
        run: npx @vscode/vsce publish --packagePath *.vsix -p "${{ secrets.VSCE_PAT }}"

      - name: Publish to Open VSX
        run: npx ovsx publish *.vsix -p "${{ secrets.OVSX_PAT }}"
